<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Default UI font for anything asking for a generic sans-serif (Qt, browsers, ...).
       Noto Sans stays next in line for characters Inter doesn't have. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
</fontconfig>
