# swaylock-style lock: solid background and a ring that reacts to typing, in Nord colors

# A wrong password just turns the ring red: no growing to fit the text, no color fade
animations {
    animation = inputFieldWidth, 0
    animation = inputFieldColors, 0
}

background {
    monitor =
    color = rgba(36, 41, 51, 1.0) # darker "Nordic Darker" base (#242933), matching kitty
}

input-field {
    monitor =
    size = 220, 220
    rounding = -1 # circle
    outline_thickness = 8
    inner_color = rgba(46, 52, 64, 1.0) # nord0

    # Small frost dots while typing (hide_input would flash random, non-Nord colors)
    dots_size    = 0.15
    dots_spacing = 0.3
    dots_color   = rgb(136, 192, 208) # frost

    outer_color    = rgba(4c566aee) # idle ring
    check_color    = rgba(81a1c1ee) # verifying
    fail_color     = rgba(bf616aee) # wrong password
    capslock_color = rgba(ebcb8bee) # caps lock on

    font_color       = rgb(216, 222, 233)
    font_family      = Inter
    placeholder_text =
    # No text: any text widens the field to text width + height, stretching the circle.
    # "Wrong" comes from the invisible field below.
    fail_text        =
    fade_on_empty    = false

    position = 0, 0
    halign = center
    valign = center
}

# Invisible second field on top of the ring that only draws "Wrong": it widens to fit the
# text, but with nothing visible the ring above stays a perfect circle
input-field {
    monitor =
    size = 120, 40 # text size follows this height
    outline_thickness = 0
    inner_color    = rgba(0, 0, 0, 0)
    outer_color    = rgba(0, 0, 0, 0)
    check_color    = rgba(0, 0, 0, 0)
    fail_color     = rgba(0, 0, 0, 0)
    capslock_color = rgba(0, 0, 0, 0)
    # Hide its dots (they'd be drawn in the red font color); hide_input's color flashes only
    # show on the outline, which this field doesn't have
    hide_input = true

    font_color       = rgb(191, 97, 106) # aurora red
    font_family      = Inter
    placeholder_text =
    fail_text        = Wrong
    fade_on_empty    = false

    position = 0, 0
    halign = center
    valign = center
}

# Clock and date above the ring
label {
    monitor =
    text = $TIME # 24-hour
    color = rgb(216, 222, 233) # snow storm
    font_size = 72
    font_family = Inter Light

    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgb(129, 161, 193) # frost
    font_size = 18
    font_family = Inter

    position = 0, 180
    halign = center
    valign = center
}
