background {
    monitor =
    path = screenshot
    color = rgba(36, 41, 51, 1.0) # darker "Nordic Darker" base (#242933), matching kitty
    blur_passes = 2
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    # Nord frost, green, red, snow storm
    outer_color = rgba(88c0d0ee) rgba(81a1c1ee) 45deg
    check_color = rgba(a3be8cee)
    fail_color  = rgba(bf616aee)

    font_color = rgb(216, 222, 233)
    fade_on_empty = false
    rounding = 0 # square, like the windows

    position = 0, -20
    halign = center
    valign = center
}
