# tp dev [name] [dir]: editor, a split shell window and a git window.
# $TP_NAME and $TP_DIR are set by tp (see .config/zsh_aliases).
new-session -d -s "$TP_NAME" -n editor -c "$TP_DIR"
send-keys   -t "$TP_NAME:editor" 'nvim' Enter

# Big pane left, two stacked on the right
new-window   -d -t "$TP_NAME" -n shell -c "$TP_DIR"
split-window -h -t "$TP_NAME:shell"   -c "$TP_DIR"
split-window -v -t "$TP_NAME:shell.1" -c "$TP_DIR" -l 30%

new-window -d -t "$TP_NAME" -n git -c "$TP_DIR"
send-keys  -t "$TP_NAME:git" 'lazygit' Enter

select-window -t "$TP_NAME:editor"
