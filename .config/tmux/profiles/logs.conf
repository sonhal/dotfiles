# tp logs [name] [dir]: four tiled panes for following logs.
# Commands are typed with send-keys, so Ctrl-C leaves a shell in the pane.
new-session  -d -s "$TP_NAME" -n logs -c "$TP_DIR"
send-keys    -t "$TP_NAME:logs" 'journalctl -f' Enter
split-window -t "$TP_NAME:logs" -c "$TP_DIR"
send-keys    -t "$TP_NAME:logs" 'journalctl -f -p warning' Enter
split-window -t "$TP_NAME:logs" -c "$TP_DIR"
split-window -t "$TP_NAME:logs" -c "$TP_DIR"
select-layout -t "$TP_NAME:logs" tiled
select-pane   -t "$TP_NAME:logs.0"
