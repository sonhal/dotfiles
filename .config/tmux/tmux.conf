unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

set -g prefix C-s
set -g mouse on
set -g default-terminal "tmux-256color"
# kitty sets TERM=xterm-kitty; advertise truecolor for it (and xterm-256color as fallback)
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB"

set-option -g status-position top

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes with prefix + HJKL; -r lets you repeat without re-pressing the prefix
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Splits on home-row keys (vim mnemonics) instead of % and ", keeping the current directory
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key S choose-tree -Zs # session picker, moved from prefix + s
bind-key c new-window -c "#{pane_current_path}"

# vim-tmux-navigator takes C-l in the root table; prefix + C-l clears the screen instead
bind-key C-l send-keys C-l

# Start numbering at 1 so the first window sits under the left hand, not on 0 at the far right
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vi copy mode (tmux-yank adds y to copy to the system clipboard)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# List of plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Status bar: no theme plugin. Named colours come from the terminal palette,
# so tmux follows the kitty theme; cyan matches the Hyprland window border.
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=black,bg=cyan,bold] #S #[default] "         # session name
set -g status-left-length 30
set -g status-right "#[fg=brightblack]#{b:pane_current_path} "       # current folder
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=black,bg=white,bold] #I:#W "
setw -g window-status-separator ""
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"
set -g message-style "fg=black,bg=yellow"                            # prompts, "reloaded"
setw -g mode-style "fg=black,bg=cyan"                                # copy-mode selection

# Start panes with a plain (non-login) shell instead of tmux's default login shell
set -g default-command "${SHELL}"

# Enable continuum restoring of tmux env
set -g @continuum-restore 'on'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
