unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

set -g prefix C-s
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set-option -g status-position top

# Number windows and panes from 1 (matches the keyboard: prefix 1 is the
# first window), and close the gaps when a window is closed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Splits and new windows start in the current pane's folder, not the
# session's start folder. | and - are easier to remember than " and %.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix f: pick a project in a popup and switch to its session (created
# on first use). Replaces the default find-window on f.
bind f display-popup -E -w 60% -h 60% ~/.local/bin/tmux-sessionizer


# Defaults that tmux-sensible used to set.
set -s escape-time 0                  # no delay after <Esc> in Neovim
set -g history-limit 50000
set -g display-time 4000              # messages stay up for 4 seconds
set -g status-interval 5
set -g focus-events on                # lets Neovim notice when its pane gains focus
setw -g aggressive-resize on
set -g status-keys emacs              # command prompt (prefix + :)
unbind C-b
bind C-s send-prefix                  # prefix + C-s sends a literal C-s
bind C-p previous-window
bind C-n next-window

# Copy mode: vi keys, copies go to the Wayland clipboard (was tmux-yank).
# Enter also copies through copy-command. A mouse selection is copied on
# release to both the clipboard and primary (middle-click), without needing
# kitty's Ctrl+Shift+C, which only sees kitty's own (Shift+drag) selections.
setw -g mode-keys vi
set -g copy-command 'wl-copy'
# v starts a selection and C-v toggles block selection, as in Vim (tmux's
# defaults are Space and v).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel 'tmux paste-buffer -p'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'x=$(cat); printf %s "$x" | wl-copy; printf %s "$x" | wl-copy --primary'

# Copy mode: o opens the selection with xdg-open, C-o in $EDITOR in a new
# window (was tmux-open). The selection is passed as an argument, never typed
# into a shell, so quotes or $(...) in it are just text.
bind -T copy-mode-vi o send -X copy-pipe-and-cancel 'xargs -r -d "\n" -I {} sh -c "cd \"\$1\" && setsid -f xdg-open \"\$2\" >/dev/null 2>&1" _ "#{pane_current_path}" {}'
bind -T copy-mode-vi C-o send -X copy-pipe-and-cancel 'xargs -r -d "\n" -I {} tmux new-window -c "#{pane_current_path}" "${EDITOR:-vi}" -- {}'

# C-hjkl moves, M-hjkl resizes, across tmux panes and Neovim windows
# (smart-splits.nvim's tmux bindings, without its TPM plugin). Neovim's
# smart-splits backend sets @pane-is-vim on its pane, so tmux hands those
# keys to Neovim there. select-pane wraps at the edges, matching
# move.at_edge = 'wrap' in nvim's smart-splits.lua.
bind -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'
bind -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'
# tmux takes C-l above, so prefix + C-l sends a real C-l to the pane
# (clear screen in the shell).
bind C-l send-keys C-l
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Status bar: no theme plugin. Named colours come from the terminal palette,
# so tmux follows the kitty theme; cyan matches the Hyprland window border.
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=black,bg=cyan,bold] #S #[default] "         # session name
set -g status-left-length 30
set -g status-right "#[fg=brightblack]#{b:pane_current_path} "       # current folder
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=black,bg=white,bold] #I:#W "
setw -g window-status-separator ""
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"
set -g message-style "fg=black,bg=yellow"                            # prompts, "reloaded"
setw -g mode-style "fg=black,bg=cyan"                                # copy-mode selection

# Ensure tmux does not starts a non-login shell
set -g default-command "${SHELL}"
