unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-s
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set-option -g status-position top

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


# List of plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Status bar: no theme plugin. Named colours come from the terminal palette,
# so tmux follows the kitty theme; cyan matches the Hyprland window border.
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=black,bg=cyan,bold] #S #[default] "         # session name
set -g status-left-length 30
set -g status-right "#[fg=brightblack]#{b:pane_current_path} "       # current folder
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=black,bg=white,bold] #I:#W "
setw -g window-status-separator ""
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"
set -g message-style "fg=black,bg=yellow"                            # prompts, "reloaded"
setw -g mode-style "fg=black,bg=cyan"                                # copy-mode selection

# Ensure tmux does not starts a non-login shell
set -g default-command "${SHELL}"

# Enable continuum restoring of tmux env
set -g @continuum-restore 'on'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
